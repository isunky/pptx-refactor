name: Release Skill

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${MANUAL_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            echo "Use a semantic version such as v0.1.0 or v0.2.0-rc.1." >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "archive=pptx-refactor-${tag}.zip" >> "${GITHUB_OUTPUT}"

      - name: Validate skill
        shell: bash
        run: |
          set -euo pipefail

          node scripts/validate_skill_bundle.mjs

          while IFS= read -r -d '' script; do
            node --check "${script}"
          done < <(find scripts tests -type f -name '*.mjs' -print0)

          node --test tests/*.test.mjs

      - name: Build release archive
        shell: bash
        env:
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail

          mkdir -p build/pptx-refactor dist
          cp SKILL.md LICENSE build/pptx-refactor/
          cp -R agents references scripts build/pptx-refactor/

          node scripts/validate_skill_bundle.mjs --root build/pptx-refactor --package

          (
            cd build
            zip -q -r "../dist/${ARCHIVE}" pptx-refactor
          )

          sha256sum "dist/${ARCHIVE}" > "dist/${ARCHIVE}.sha256"
          unzip -t "dist/${ARCHIVE}"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/${{ steps.version.outputs.archive }}

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ARCHIVE: ${{ steps.version.outputs.archive }}
        run: |
          set -euo pipefail

          assets=(
            "dist/${ARCHIVE}#PPTX Refactor Skill"
            "dist/${ARCHIVE}.sha256#SHA-256 checksum"
          )

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Published releases are immutable; use a new version." >&2
            exit 1
          fi

          cat > release-notes.txt <<'EOF'
          ## 安装 / Installation

          下载 ZIP 和 SHA-256 校验文件，将压缩包中的 `pptx-refactor` 文件夹解压到 Codex Skills 目录，然后调用 `$pptx-refactor`。

          Download the ZIP and checksum, extract the contained `pptx-refactor` folder into the Codex Skills directory, then invoke `$pptx-refactor`.

          Verify build provenance with `gh attestation verify <zip-file> --repo isunky/pptx-refactor`.
          EOF

          create_args=(
            release create "${TAG}"
            "${assets[@]}"
            --title "PPTX Refactor ${TAG}"
            --generate-notes
            --notes-file release-notes.txt
          )

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]] || git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            create_args+=(--verify-tag)
          else
            create_args+=(--target "${GITHUB_SHA}")
          fi

          if [[ "${TAG}" == *-* ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}"
